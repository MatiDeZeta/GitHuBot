version: 2

updates:
  # Dependency updates arrive as reviewable PRs. Combined with the committed
  # lockfile and CI's --frozen-lockfile, that means no dependency can change
  # without a diff someone approved.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # Dependabot does not inspect package contents — it only bumps versions — so
    # without this it would happily open a PR for a release published minutes
    # ago, which is exactly the window minimumReleaseAge exists to skip. CI would
    # reject that PR (pnpm enforces the policy against the lockfile), but it is
    # better not to raise it at all. Kept at 3 days to match minimumReleaseAge.
    # Security updates deliberately ignore cooldown, so CVE fixes still arrive fast.
    cooldown:
      default-days: 3
    groups:
      # Patch/minor noise lands as one reviewable PR instead of a dozen.
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      development:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
      # Security fixes are grouped separately so they are never buried in
      # routine version bumps.
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # @types/node must describe the Node major we actually run (see the docker
      # entry below), not the newest one — moving it is part of a runtime upgrade.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  # Actions are pinned to commit SHAs in the workflow; Dependabot understands
  # that form and keeps the trailing "# v4" comment in step with the SHA it
  # bumps to. Without this the pins would silently rot.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # One PR for all action bumps; they are reviewed the same way.
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]

  # The Dockerfile pins node by digest; without this the pin would go stale and
  # stop receiving base-image security updates.
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # Digest and minor/patch updates only. A new Node major is a deliberate
      # runtime upgrade (engines, CI, @types/node move with it), and odd majors are
      # never LTS — Dependabot proposed 25-alpine, which is both.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    labels: [dependencies, docker]
